<footer class="bg-canvas text-white py-16 px-8 md:px-16 lg:px-24 relative border-t border-white/5">
    <div class="max-w-7xl mx-auto">

        <!-- Top Row : Nom avec point coloré (rôle actif) + Bouton Scroll to Top -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
            <div>
                <h2 class="text-3xl md:text-5xl font-bold tracking-tight flex items-center gap-1">
                    Miguel Souop
                    <span class="inline-block w-3 h-3 rounded-full bg-accent transition-colors duration-300"
                        aria-hidden="true"></span>
                </h2>
                <p class="text-gray-400 text-xs md:text-sm mt-3 max-w-md font-light leading-relaxed">
                    {{ description() }}
                </p>
            </div>

            <!-- Bouton Scroll to Top : hover teinté par la couleur du rôle actif -->
            <a href="#" (click)="scrollToTop($event)"
                class="w-12 h-12 rounded-full border border-accent-muted/60 text-gray-300 hover:border-accent hover:text-accent flex items-center justify-center transition-all duration-300 cursor-pointer group"
                [attr.title]="text().scrollTop" [attr.aria-label]="text().scrollTop">
                <svg class="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
            </a>
        </div>

        <!-- Ligne de séparation -->
        <div class="w-full h-px bg-white/10 mb-10"></div>

        <!-- Bottom Row : Métadonnées du rôle, Ancres et Copyright -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-6 text-xs text-gray-400">

            <!-- Clôture spécifique à la casquette active -->
            <div>
                <span class="block text-white font-medium mb-0.5">{{ roleMeta().tag }}</span>
                <span>{{ roleMeta().closing }}</span>
            </div>

            <!-- Ancres de navigation (libellés bilingues) -->
            <nav class="flex flex-wrap items-center justify-center gap-6 font-medium">
                @for (item of navItems; track item.id) {
                <button (click)="scrollTo(item.id)"
                    class="hover:text-white transition-colors cursor-pointer">{{ item.label[lang()] }}</button>
                }
            </nav>

            <!-- Copyright -->
            <div class="text-right">
                <p>{{ copyright() }}</p>
            </div>

        </div>

    </div>
</footer>
