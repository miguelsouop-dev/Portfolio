<section id="contact" class="py-24 px-8 md:px-16 lg:px-24 bg-canvas relative">
    <div class="max-w-7xl mx-auto">
        <!-- En-tête de section -->
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 border-b border-white/10 pb-8">
            <h2
                class="text-3xl  md:text-4xl font-extrabold text-accent uppercase tracking-tight transition-colors duration-300">
                {{ text().badge }}
            </h2>
            <p
                class="text-gray-400 text-xs md:text-sm max-w-sm mt-4 md:mt-0 text-left md:text-right font-light leading-relaxed">
                {{ subtitle() }}
            </p>
        </div>

        <!-- Grille principale 2 colonnes -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16">

            <!-- Colonne Gauche : Informations & Réseaux Sociaux -->
            <div class="lg:col-span-5 flex flex-col justify-between space-y-8">
                <div>
                    <h3 class="text-xs uppercase tracking-widest text-white/60  mb-6">
                        {{ text().infoTitle }}
                    </h3>

                    <div class="space-y-6">
                        <!-- Email -->
                        <div class="flex items-center space-x-4">
                            <div
                                class="w-12 h-12 rounded-full bg-surface border border-white/10 flex items-center justify-center text-gray-300">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <span class="block text-xs text-gray-500 uppercase">{{ text().emailLabel }}</span>
                                <a [href]="'mailto:' + info.email"
                                    class="text-white text-sm md:text-base font-medium hover:underline">
                                    {{ info.email }}
                                </a>
                            </div>
                        </div>

                        <!-- Téléphone -->
                        <div class="flex items-center space-x-4">
                            <div
                                class="w-12 h-12 rounded-full bg-surface border border-white/10 flex items-center justify-center text-gray-300">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <span class="block text-xs text-gray-500 uppercase">{{ text().phoneLabel }}</span>
                                <span class="text-white text-sm md:text-base font-medium">{{ info.phone }}</span>
                            </div>
                        </div>

                        <!-- Localisation -->
                        <div class="flex items-center space-x-4">
                            <div
                                class="w-12 h-12 rounded-full bg-surface border border-white/10 flex items-center justify-center text-gray-300">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </div>
                            <div>
                                <span class="block text-xs text-gray-500 uppercase">{{ text().locationLabel }}</span>
                                <span class="text-white text-sm md:text-base font-medium">{{ text().location }}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Réseaux Sociaux : hover teinté par la couleur du rôle actif -->
                <div class="pt-8 border-t border-white/10">
                    <h3 class="text-xs uppercase tracking-widest text-white/60 mb-4">
                        {{ text().socialTitle }}
                    </h3>
                    <div class="flex items-center space-x-4">
                        <!-- GitHub -->
                        <a [href]="info.github" target="_blank" rel="noopener noreferrer"
                            [attr.aria-label]="text().socialGithubLabel" [attr.title]="text().socialGithubLabel"
                            class="w-10 h-10 rounded-full bg-surface border border-white/10 flex items-center justify-center text-white hover:border-accent hover:text-accent transition-colors duration-300">
                            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                <path
                                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                            </svg>
                        </a>
                        <!-- LinkedIn -->
                        <a [href]="info.linkedin" target="_blank" rel="noopener noreferrer"
                            [attr.aria-label]="text().socialLinkedinLabel" [attr.title]="text().socialLinkedinLabel"
                            class="w-10 h-10 rounded-full bg-surface border border-white/10 flex items-center justify-center text-white hover:border-accent hover:text-accent transition-colors duration-300">
                            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                <path
                                    d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                            </svg>
                        </a>
                        <!-- Email -->
                        <a [href]="'mailto:' + info.email" [attr.aria-label]="text().socialEmailLabel"
                            [attr.title]="text().socialEmailLabel"
                            class="w-10 h-10 rounded-full bg-surface border border-white/10 flex items-center justify-center text-white hover:border-accent hover:text-accent transition-colors duration-300">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Colonne Droite : Formulaire -->
            <div class="lg:col-span-7 p-8 ">
                <h3 class="text-xs uppercase tracking-tight text-white/80 mb-8">
                    {{ text().formTitle }}
                </h3>

                <form (ngSubmit)="onSubmit()" class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Nom -->
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">{{ text().nameLabel
                                }}</label>
                            <input type="text" [(ngModel)]="formData.name" name="name" required
                                class="w-full bg-transparent border-b border-white/20 focus:border-accent pb-3 text-white text-sm focus:outline-none transition-colors duration-300" />
                        </div>

                        <!-- Email -->
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">{{
                                text().emailLabel
                                }}</label>
                            <input type="email" [(ngModel)]="formData.email" name="email" required
                                class="w-full bg-transparent border-b border-white/20 focus:border-accent pb-3 text-white text-sm focus:outline-none transition-colors duration-300" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Entreprise -->
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">{{
                                text().companyLabel }}</label>
                            <input type="text" [(ngModel)]="formData.company" name="company"
                                class="w-full bg-transparent border-b border-white/20 focus:border-accent pb-3 text-white text-sm focus:outline-none transition-colors duration-300" />
                        </div>

                        <!-- Sujet -->
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">{{
                                text().subjectLabel
                                }}</label>
                            <input type="text" [(ngModel)]="formData.subject" name="subject"
                                class="w-full bg-transparent border-b border-white/20 focus:border-accent pb-3 text-white text-sm focus:outline-none transition-colors duration-300" />
                        </div>
                    </div>

                    <!-- Message -->
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">{{ text().messageLabel
                            }}</label>
                        <textarea [(ngModel)]="formData.message" name="message" rows="4" required
                            class="w-full bg-transparent border-b border-white/20 focus:border-accent pb-3 text-white text-sm focus:outline-none transition-colors duration-300 resize-none"></textarea>
                    </div>

                    <!-- Bouton d'envoi -->
                    <div class="pt-4">
                        <button type="submit"
                            class="inline-flex items-center justify-center px-8 py-3.5 rounded-full text-xs font-bold uppercase tracking-wider text-white bg-accent hover:bg-accent/90 shadow-lg transition-all duration-300 cursor-pointer">
                            <span>{{ text().submitLabel }}</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="icon ml-2 icon-tabler icons-tabler-outline icon-tabler-brand-telegram">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</section>
